name: laravel-snip
icon: null
processes:
  PHP Server:
    command: php -S 127.0.0.1:8000 -t .
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  npm:build:
    command: npm run build
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  npm:dev:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Playground:
    command: (sleep 1 && open http://127.0.0.1:8001/playground/) & php -S 127.0.0.1:8001 -t .
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
