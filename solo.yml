name: laravel-snip
icon: null
processes:
  PHP Server:
    command: php -S 127.0.0.1:8000 -t .
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  npm:build:
    command: npm run build
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  npm:dev:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
